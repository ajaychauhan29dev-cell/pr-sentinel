name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck (builds packages first)
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Offline demo (mock provider, fixture PR)
        run: npm run demo
      - name: Build web app
        run: npm run build -w @pr-sentinel/web
        env:
          NEXT_TELEMETRY_DISABLED: "1"
